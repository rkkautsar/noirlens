name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'modules/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/ios-unsigned-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Test artifact: unlock scans so a sideload can be exercised without
      # StoreKit. Do not set this in a production/App Store build.
      EXPO_PUBLIC_DEV_UNLIMITED: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate native project (CNG)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install --project-directory=ios

      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -workspace ios/NoirLens.xcworkspace \
            -scheme NoirLens \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoirLens.app Payload/
          zip -qry NoirLens-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoirLens-unsigned-ipa
          path: NoirLens-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
